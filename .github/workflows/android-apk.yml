name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).

      - name: Install dependencies
        run: npm ci > ci.log 2>&1 || { tail -40 ci.log | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=npm ci::/'; echo; exit 1; }

      - name: Type-check and test
        run: |
          npx tsc --noEmit
          npx jest

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a > ../gradle.log 2>&1 || {
            grep -E "FAILURE|What went wrong|error:|Error:|> " ../gradle.log | tail -40 | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=gradle::/'; echo; exit 1; }
          tail -5 ../gradle.log

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "sanova-${VERSION}-build${{ github.run_number }}.apk"
          echo "APK_NAME=sanova-${VERSION}-build${{ github.run_number }}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanova-apk
          path: ${{ env.APK_NAME }}

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sanova test build ${{ github.run_number }}
          prerelease: true
          files: ${{ env.APK_NAME }}
          body: |
            Android test build of Sanova. Download the .apk below on your phone and open it to install
            (allow "Install unknown apps" for your browser or Files app when asked).
